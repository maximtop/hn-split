name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The job ids `check` and `package` are the status checks the master ruleset requires.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run quality checks and end-to-end tests
        run: pnpm verify
      - name: Retain Playwright results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build release archives
        run: pnpm release
      - name: Verify built manifests
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(jq -er '.version' package.json)"
          for ZIP in build/release/*.zip; do
            BROWSER="$(basename "$ZIP" .zip)"
            BUILT_VERSION="$(jq -er '.version' "build/release/$BROWSER/manifest.json")"
            if [[ "$BUILT_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "build/release/$BROWSER/manifest.json version $BUILT_VERSION != package.json $PACKAGE_VERSION" >&2
              exit 1
            fi
          done
      - name: Retain extension archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hn-split-packages
          path: build/release/*.zip
          if-no-files-found: error
          retention-days: 7
