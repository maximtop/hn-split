<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-label="Split for Hacker News marquee: brand lockup beside a browser window split between an article and its Hacker News discussion">
  <defs>
    <radialGradient id="glow-m" cx="80%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#3A2A1C"/>
      <stop offset="55%" stop-color="#1B202B"/>
      <stop offset="100%" stop-color="#151922"/>
    </radialGradient>
    <clipPath id="panes-m">
      <rect x="110" y="130" width="118" height="118" rx="20"/>
    </clipPath>
    <clipPath id="win-m">
      <rect x="880" y="80" width="440" height="400" rx="18"/>
    </clipPath>
  </defs>
  <rect width="1400" height="560" fill="url(#glow-m)"/>

  <!-- brand mark 144x144 at (97,117) -->
  <rect x="99" y="119" width="140" height="140" rx="32" fill="#232733"/>
  <g clip-path="url(#panes-m)">
    <rect x="110" y="130" width="59" height="118" fill="#F7F3EA"/>
